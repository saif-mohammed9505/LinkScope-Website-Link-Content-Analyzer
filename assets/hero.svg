<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15181D"/>
      <stop offset="100%" stop-color="#20252C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>

  <!-- browser window motif -->
  <g transform="translate(830,40)">
    <rect x="0" y="0" width="330" height="170" rx="10" fill="#FAFAF7" opacity="0.06"/>
    <rect x="0" y="0" width="330" height="28" rx="10" fill="#FAFAF7" opacity="0.1"/>
    <circle cx="16" cy="14" r="4" fill="#FF6B5D"/>
    <circle cx="30" cy="14" r="4" fill="#F5C463"/>
    <circle cx="44" cy="14" r="4" fill="#2BD9A7"/>
    <line x1="18" y1="50" x2="300" y2="50" stroke="#FAFAF7" stroke-width="6" opacity="0.18"/>
    <line x1="18" y1="70" x2="260" y2="70" stroke="#FAFAF7" stroke-width="6" opacity="0.14"/>
    <line x1="18" y1="90" x2="280" y2="90" stroke="#FAFAF7" stroke-width="6" opacity="0.14"/>
    <line x1="18" y1="110" x2="220" y2="110" stroke="#2BD9A7" stroke-width="6" opacity="0.5"/>
    <line x1="18" y1="130" x2="250" y2="130" stroke="#FAFAF7" stroke-width="6" opacity="0.14"/>

    <!-- magnifying glass -->
    <circle cx="245" cy="105" r="46" fill="none" stroke="#FF6B5D" stroke-width="7"/>
    <line x1="278" y1="140" x2="312" y2="174" stroke="#FF6B5D" stroke-width="9" stroke-linecap="round"/>
  </g>

  <text x="60" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#FAFAF7">LinkScope</text>
  <text x="61" y="144" font-family="Arial, sans-serif" font-size="17" fill="#9AA3AE" letter-spacing="0.4">Peek at any page's title, text, and outbound links</text>
  <rect x="61" y="166" width="26" height="4" rx="2" fill="#2BD9A7"/>
  <rect x="93" y="166" width="26" height="4" rx="2" fill="#FF6B5D" opacity="0.6"/>
</svg>
